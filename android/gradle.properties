org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.enableJetifier=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.sdk.dir=../build-tools/android-sdk

# JDK 不在此指定：gradle.bat 启动前先校验 JAVA_HOME（此时尚未读取本文件），
# 且此处相对路径相对 ~/.gradle 解析、非项目根，无法指向随仓库走的 build-tools/jdk。
# JDK 统一由 build.bat 用 %~dp0..\build-tools\jdk\jdk-17.0.20.1+1 相对脚本目录注入 JAVA_HOME，
# 换机器只要 build-tools 目录结构一致即可，无需改任何绝对路径。

